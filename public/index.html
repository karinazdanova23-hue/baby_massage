function interruptCourse(clientId, courseId, date){
  const client = clients.find(c=>c.id===clientId);
  const course = client ? (client.courses||[]).find(co=>co.id===courseId) : null;
  if(!course) return;
  const today = todayISO();
  const from = date>=today ? date : today;
  const future = getCourseTimeline(course).filter(t=>t.type==='session' && t.date>=from);
  const cv = getCoverage(clientId, courseId);
  const prepaidLost = future.filter(t=>cv.covered[t.date]).length;
  let msg = client.parentName+' · '+client.childName+'\nБудущих сеансов: '+future.length+' — они будут удалены, курс отметится как «прерванный».';
  if(prepaidLost) msg += '\n\nЗа '+prepaidLost+' из них уже внесена предоплата (около '+fmtMoney(prepaidLost*Number(client.price||0))+' ₽). Она останется в доходах — при необходимости верните её клиенту.';
  askConfirm('Завершить курс?', msg, 'Да, завершить', ()=>doInterrupt(client, course, from, future.length), true);
}
function doInterrupt(client, course, from, leftCount){
  const today = todayISO();
  const future = {length:leftCount};
  course.statusBeforeInterrupt = course.status || 'progress';
  course.interruptedFrom = from;
  course.interruptedAt = today;
  course.interruptedLeft = future.length;
  course.status = 'done';
  course.followUpHandled = true;
  saveClients();
  closeSheet();
  setTimeout(render, 190);
}
function resumeCourse(courseId){
  for(const client of clients){
    const course = (client.courses||[]).find(co=>co.id===courseId);
    if(course){
      askConfirm('Возобновить курс?', 'Удалённые сеансы вернутся, курс снова станет активным.', 'Да, возобновить', ()=>{
        delete course.interruptedFrom; delete course.interruptedAt; delete course.interruptedLeft;
        course.status = course.statusBeforeInterrupt || 'progress';
        delete course.statusBeforeInterrupt;
        course.followUpHandled = false;
        saveClients();
        openClientDetail(client.id);
      }, false);
      return;
    }
  }
}
function toggleOffDay(iso){
  if(iso < todayISO()) return;
  if(offDays.includes(iso)){
    offDays = offDays.filter(d=>d!==iso);
    offMsg = fmtDateLong(iso)+': выходной снят, сеансы вернулись на эту дату.';
  }else{
    const n = getSessionsForDate(iso).length;
    offDays = offDays.concat(iso).sort();
    offMsg = fmtDateLong(iso)+': выходной.' + (n ? ' Сдвинуто сеансов: '+n+' — эти курсы закончатся позже.' : ' Клиентов на эту дату нет.');
  }
  saveOffDays();
  render();
}

function openMoveSession(clientId, courseId, date){
  const client = clients.find(c=>c.id===clientId);
  const course = client ? (client.courses||[]).find(co=>co.id===courseId) : null;
  if(!course) return;
  const cur = getSessionTime(client, course, date);
  const moved = Object.keys(course.moves||{}).find(k=>course.moves[k]===date);
  const dflt = toISO(addDays(parseISO(date), 1)) < todayISO() ? todayISO() : toISO(addDays(parseISO(date), 1));
  showSheet(`
    <div class="sheet-handle"></div>
    <h2>Перенести сеанс</h2>
    <div class="sub" style="margin-bottom:10px;">${escapeHtml(client.parentName)} · ${escapeHtml(client.childName)}<br>Сейчас: ${fmtDateLong(date)}${cur ? ', '+escapeHtml(cur) : ''}</div>
    <button type="button" class="btn btn-primary" style="width:100%;margin-bottom:4px;" data-action="move-auto" data-client="${clientId}" data-course="${courseId}" data-date="${date}">Перенести автоматически</button>
    <div class="sub" style="margin-bottom:14px;text-align:center;">Этот сеанс уйдёт на ближайший свободный день в конце курса — курс закончится позже.</div>
    <div class="sub" style="margin-bottom:8px;font-weight:600;">Или выберите конкретную дату:</div>
    <div id="move-error" class="hidden" style="background:var(--rose-soft);color:#7A3B2E;padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:12px;"></div>
    <form id="move-form" novalidate>
      <label class="field"><span>Новая дата</span><input type="date" name="toDate" value="${dflt}"></label>
      <label class="field"><span>Время (необязательно)</span><input type="time" name="time" value="${escapeHtml(cur||'')}"></label>
      <div id="cap-hint" class="cap-hint hidden"></div>
    </form>
    <div class="row-btns">
      <button type="button" class="btn btn-ghost" data-action="close-sheet">Отмена</button>
      <button type="button" class="btn btn-outline" id="move-save-btn">Перенести на эту дату</button>
    </div>
    ${moved ? `<button type="button" class="btn btn-outline" style="margin-top:8px;width:100%;" id="move-back-btn">Вернуть на ${fmtDateLong(moved)}</button>` : ''}
  `);
  (function(){
    const f = document.getElementById('move-form'), h = document.getElementById('cap-hint');
    const upd = ()=>{
      const dt = f.querySelector('[name=toDate]').value;
      const n = dt ? countOnDate(dt, null) : 0;
      const res = n>=CAP_MAX ? {level:'block',date:dt,count:n} : (n>=CAP_WARN ? {level:'warn',date:dt,count:n} : null);
      const offNote = dt && isGlobalOff(dt) ? 'В этот день у вас выходной. ' : '';
      h.textContent = offNote + capacityMessage(res);
      h.className = 'cap-hint' + (offNote ? ' block' : (res ? ' '+res.level : ' hidden'));
    };
    f.querySelector('[name=toDate]').addEventListener('input', upd);
    f.querySelector('[name=toDate]').addEventListener('change', upd);
    upd();
  })();
  const errBox = document.getElementById('move-error');
  const doMove = (toDate, time)=>{
    const err = moveSession(clientId, courseId, date, toDate, time, true);
    if(err){ errBox.textContent = err; errBox.classList.remove('hidden'); return; }
    askConfirm('Перенести сеанс?', client.parentName+' · '+client.childName+'\nС '+fmtDateLong(date)+' на '+fmtDateLong(toDate)+(time ? ', '+time : '')+'.', 'Да, перенести', ()=>{
      const e2 = moveSession(clientId, courseId, date, toDate, time);
      if(e2){ toast(e2); return; }
      closeSheet();
      setTimeout(render, 190);
    }, false);
  };
  document.getElementById('move-save-btn').addEventListener('click', ()=>{
    const fd = new FormData(document.getElementById('move-form'));
    doMove(fd.get('toDate'), fd.get('time'));
  });
  const back = document.getElementById('move-back-btn');
  if(back) back.addEventListener('click', ()=>doMove(moved, ''));
}

      saveClients();
      return client;
    }

function startNewCourse(clientId){
  const client = clients.find(c=>c.id===clientId);
  if(!client) return;
  const last = latestCourse(client);
  const capRes = capacityCheck(courseDates(todayISO(), last ? last.totalSessions : 10), null);
  if(capRes && capRes.level==='block'){ toast(capacityMessage(capRes)); return; }
  if(capRes){
    askConfirm('Начать новый курс?', capacityMessage(capRes)+'\nВсё равно начать курс с сегодняшнего дня?', 'Да, начать', ()=>createCourseNow(client, last), false);
    return;
  }
  createCourseNow(client, last);

  client.courses = client.courses || [];
  client.courses.push({
    id: genId(),
    startDate: todayISO(),
    totalSessions: last ? last.totalSessions : 10,

    timeOverrides: {},

  });

  openClientDetail(client.id);

function deleteClient(id){

  client.deleted = true;

  saveClients();

function restoreClient(id){

  if(!client) return;
  delete client.deleted;
  delete client.deletedAt;
  saveClients();
  openDeletedSheet();

function parseAgeToMonths(text){
  if(!text) return null;
  const t = String(text).toLowerCase().replace(',', '.');
  const m = t.match(/(\d+(\.\d+)?)/);
  if(!m) return null;
  const num = parseFloat(m[1]);
  if(/год|лет/.test(t)) return num*12;
  if(/мес/.test(t)) return num;
  return num<=17 ? num*12 : num;
}
function fmtAgeMonths(months){
  const m = Math.round(months);
  if(m<12) return m+' мес.';
  const years = Math.floor(m/12);
  const rem = m%12;
  return rem ? years+' г. '+rem+' мес.' : years+' г.';
}

}

  const maxSum = Math.max(1, ...rows.map(r=>r.sum));

  const monthRows = rows.map(r=>`

    </div>
    <div class="summary-row">
      <div class="summary-card"><div class="val">${fmtMoney(avg)} ₽</div><div class="lab">Средний чек</div></div>
      <div class="summary-card"><div class="val">${totalNew}</div><div class="lab">Новых клиентов</div></div>
    </div>
    <div class="card" style="font-size:13.5px;line-height:1.7;">
      ${best ? `Лучший месяц: <b>${MONTHS[best.m]}</b> · ${fmtMoney(best.sum)} ₽<br>` : ''}

function renderAnalytics(){
  if(analyticsView==='year') return renderYearAnalytics();
  const monthKey = calYear+'-'+pad(calMonth+1);
  const monthRevenue = revenue.filter(r=>r.date.startsWith(monthKey));
  const sessionsCount = sessionsIn(monthRevenue);
  const revenueSum = monthRevenue.reduce((s,r)=>s+Number(r.amount),0);
  const avgCheck = sessionsCount ? Math.round(revenueSum/sessionsCount) : 0;

  const withGender = activeClients().filter(c=>c.gender==='male'||c.gender==='female');
  const boys = withGender.filter(c=>c.gender==='male').length;
  const girls = withGender.filter(c=>c.gender==='female').length;
  const totalG = boys+girls;
  const boyPct = totalG ? Math.round(boys/totalG*100) : 0;
  const girlPct = totalG ? 100-boyPct : 0;

  const ages = activeClients().map(c=>parseAgeToMonths(c.childAge)).filter(v=>v!==null);
  const ageBuckets = {
    under6: ages.filter(m=>m<6).length,
    under1y: ages.filter(m=>m>=6 && m<12).length,
    y1to3: ages.filter(m=>m>=12 && m<36).length,
    over3: ages.filter(m=>m>=36).length
  };

  const activeCourses = activeClients().reduce((count,c)=>{
    const lc = latestCourse(c);
    if(lc && !isCourseComplete(c, lc)) count++;
    return count;
  },0);

  // Trend over last 6 months (including current)
  const trendMonths = [];
  for(let i=5;i>=0;i--){
    let m = calMonth - i, y = calYear;
    while(m<0){ m+=12; y--; }
    trendMonths.push({y, m});
  }
  const trendData = trendMonths.map(({y,m})=>{
    const key = y+'-'+pad(m+1);
    const entries = revenue.filter(r=>r.date.startsWith(key));
    return {
      label: MONTHS[m].slice(0,3),
      count: sessionsIn(entries),
      sum: entries.reduce((s,r)=>s+Number(r.amount),0)
    };
  });
  const maxCount = Math.max(1, ...trendData.map(t=>t.count));
  const trendBars = trendData.map(t=>`
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;">
      <div style="font-size:11px;color:var(--ink-faint);">${t.count}</div>
      <div style="width:100%;max-width:26px;height:${Math.max(4, Math.round(t.count/maxCount*70))}px;background:var(--accent);border-radius:5px;"></div>

  const repeatClients = clientsWithCourses.filter(c=>c.courses.length>1).length;
  const repeatPct = clientsWithCourses.length ? Math.round(repeatClients/clientsWithCourses.length*100) : 0;

  const allCourses = activeClients().flatMap(cl=>cl.courses||[]);
  const interruptedAll = allCourses.filter(co=>co.interruptedFrom);
  const interruptedMonth = interruptedAll.filter(co=>(co.interruptedAt||'').startsWith(monthKey)).length;
  const interruptedPct = allCourses.length ? Math.round(interruptedAll.length/allCourses.length*100) : 0;
  const activeList = activeClients();
  const districtCounts = DISTRICTS.map(d=>({name:d, count: activeList.filter(c=>clientDistricts(c).includes(d)).length}));
  const noDistrictCount = activeList.filter(c=>clientDistricts(c).length===0).length;
  const maxDistrict = Math.max(1, noDistrictCount, ...districtCounts.map(x=>x.count));
  const srcCounts = SOURCES.map(s=>({name:s, count: activeList.filter(x=>x.source===s).length}));
  const noSrc = activeList.filter(x=>!x.source).length;
  const maxSrc = Math.max(1, noSrc, ...srcCounts.map(x=>x.count));

  const districtRows = districtCounts.map(x=>districtRowHtml(x.name, x.count, maxDistrict, x.name)).join('')
    + (noDistrictCount ? districtRowHtml('Не указан', noDistrictCount, maxDistrict, 'none') : '');

  return `
    ${analyticsToggleHtml()}
    <div class="cal-header">
      <button data-action="prev-month">‹</button>
      <div class="month">${MONTHS[calMonth]} ${calYear}</div>
      <button data-action="next-month">›</button>
    </div>

      <div class="summary-card"><div class="val">${sessionsCount}</div><div class="lab">сеансов за месяц</div></div>
      <div class="summary-card"><div class="val">${fmtMoney(revenueSum)}</div><div class="lab">доход, ₽</div></div>
      <div class="summary-card"><div class="val">${fmtMoney(avgCheck)}</div><div class="lab">средний чек, ₽</div></div>

    <h3>Динамика за 6 месяцев</h3>

      <div style="display:flex;align-items:flex-end;gap:6px;height:110px;">${trendBars}</div>

    <h3>Откуда узнали</h3>

/* ---------------- Tasks UI ---------------- */
function isSheetOpen(){ return document.getElementById('overlay').classList.contains('show'); }

function toggleTask(id){
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  t.done = !t.done;
  t.doneAt = t.done ? Date.now() : null;
  if(t.done && t.repeat && t.date && !t.nextId){
    let nd = nextRepeatDate(t.date, t.repeat);
    const today = todayISO();
    let guard = 0;
    while(nd < today && guard++ < 400) nd = nextRepeatDate(nd, t.repeat);
    const nt = {id: genId(), title:t.title, date:nd, time:t.time||'', author:t.author, note:t.note||'', repeat:t.repeat, done:false};
    tasks.push(nt);
    t.nextId = nt.id;
  }else if(!t.done && t.nextId){
    const nxt = tasks.find(x=>x.id===t.nextId);
    if(nxt && !nxt.done) tasks = tasks.filter(x=>x.id!==t.nextId);
    t.nextId = null;
  }
  saveTasks();
  const sheetOpen = isSheetOpen();
  render();
  if(sheetOpen && t.date) openTaskDaySheet(t.date);
}

  const sheetDate = isSheetOpen() ? (existing ? existing.date : presetDate) : null;
  const t = existing || {title:'', date: noDeadline ? '' : (presetDate || todayISO()), time:'', author: (window.__ROLE==='karina' ? 'karina' : 'husband'), note:''};

    <form id="task-form" novalidate>

        <label class="field" style="flex:1;"><span>Время (необязательно)</span><input type="time" name="time" value="${escapeHtml(t.time)}"></label>

        <div class="seg" id="task-author-seg">
          <button type="button" class="${t.author!=='karina'?'active':''}" data-val="husband">Муж</button>
          <button type="button" class="${t.author==='karina'?'active':''}" data-val="karina">Карина</button>
        </div>
        <input type="hidden" name="author" value="${t.author==='karina'?'karina':'husband'}">
      </label>
      <label class="field"><span>Комментарий</span><textarea name="note">${escapeHtml(t.note)}</textarea></label>
    </form>
    <div class="row-btns">
      <button type="button" class="btn btn-ghost" id="task-cancel-btn">Отмена</button>
      <button type="button" class="btn btn-primary" id="task-save-btn">Сохранить</button>
    </div>
    ${existing ? `<button type="button" class="btn btn-danger" style="margin-top:8px;" id="task-delete-btn">Удалить задачу</button>` : ''}
  `);

  const seg = document.getElementById('task-author-seg');
  seg.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      seg.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelector('#task-form input[name=author]').value = btn.dataset.val;
    });
  });

  const deadlineSeg = document.getElementById('task-deadline-seg');
  deadlineSeg.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      deadlineSeg.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelector('#task-form input[name=hasDeadline]').value = btn.dataset.val;
      document.getElementById('task-deadline-fields').classList.toggle('hidden', btn.dataset.val==='none');
      document.getElementById('task-repeat-field').classList.toggle('hidden', btn.dataset.val==='none');
    });
  });

  document.getElementById('task-cancel-btn').addEventListener('click', ()=>{
    if(sheetDate) openTaskDaySheet(sheetDate); else closeSheet();
  });

  document.getElementById('task-save-btn').addEventListener('click', ()=>{
    const fd = new FormData(document.getElementById('task-form'));
    const title = (fd.get('title')||'').trim();
    const withDeadline = fd.get('hasDeadline')==='has';
    const date = withDeadline ? (fd.get('date') || '') : '';
    const errBox = document.getElementById('task-form-error');
    if(!title || (withDeadline && !date)){
      errBox.textContent = 'Заполните: ' + [!title?'что нужно сделать':'', (withDeadline && !date)?'дату дедлайна':''].filter(Boolean).join(', ');

      return;
    }
    const data = {
      title, date,
      time: withDeadline ? (fd.get('time') || '') : '',
      author: fd.get('author')==='karina' ? 'karina' : 'husband',
      note: (fd.get('note')||'').trim(),
      repeat: (withDeadline && REPEAT_LABELS[fd.get('repeat')]) ? fd.get('repeat') : ''
    };
    if(existing){
      Object.assign(existing, data);
    }else{
      tasks.push(Object.assign({id: genId(), done:false}, data));
    }
    saveTasks();
    render();
    if(sheetDate){ openTaskDaySheet(date || sheetDate); } else closeSheet();
  });

  if(existing){
    document.getElementById('task-delete-btn').addEventListener('click', ()=>{
      askConfirm('Удалить задачу?', existing.title, 'Да, удалить', ()=>{
        tasks = tasks.filter(x=>x.id!==existing.id);
        saveTasks();
        render();
        if(sheetDate) openTaskDaySheet(sheetDate); else closeSheet();
      }, true);
    });
  }
}

/* ---------------- Export / backup ---------------- */
function exportDataJSON(){
  return JSON.stringify({clients, revenue, tasks, offDays, exportedAt: new Date().toISOString()}, null, 2);
}
function openExportSheet(){
  const json = exportDataJSON();
  showSheet(`
    <div class="sheet-handle"></div>
    <h2>Резервная копия</h2>
    <div class="sub">Сохраните файл или скопируйте текст — если что-то случится с данными, из этого можно будет всё восстановить вручную.</div>
    <textarea id="export-text" readonly style="height:180px;font-size:11px;font-family:monospace;">${escapeHtml(json)}</textarea>
    <div class="row-btns" style="margin-top:10px;">
      <button type="button" class="btn btn-outline" data-action="copy-export">Скопировать</button>
      <button type="button" class="btn btn-primary" data-action="download-export">Скачать файл</button>
    </div>
  `);
}
function downloadExport(){
  const json = exportDataJSON();
  try{
    const blob = new Blob([json], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'massage-journal-backup-'+todayISO()+'.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 3000);
  }catch(e){
    copyToClipboard(json);
    toast('Не удалось скачать файл автоматически. Текст копии скопирован в буфер обмена — вставьте его в заметку.');
  }
}
function copyExport(){
  const ok = copyToClipboard(exportDataJSON());
  toast(ok ? 'Скопировано в буфер обмена' : 'Не удалось скопировать автоматически — выделите текст в поле выше вручную.');
}

function openImportSheet(){
  showSheet(`
    <div class="sheet-handle"></div>
    <h2>Восстановить из копии</h2>
    <div class="sub" style="color:#7A3B2E;">Внимание: это заменит все текущие данные в приложении данными из копии.</div>
    <label class="field"><span>Выбрать файл</span><input type="file" id="import-file" accept="application/json,.json"></label>
    <label class="field"><span>...или вставьте текст копии сюда</span><textarea id="import-text" style="height:140px;font-family:monospace;font-size:11px;"></textarea></label>
    <div class="row-btns">
      <button type="button" class="btn btn-ghost" data-action="close-sheet">Отмена</button>
      <button type="button" id="import-btn" class="btn btn-primary">Восстановить</button>
    </div>
  `);
  document.getElementById('import-file').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{ document.getElementById('import-text').value = reader.result; };
    reader.readAsText(file);
  });
  document.getElementById('import-btn').addEventListener('click', ()=>{
    const text = document.getElementById('import-text').value.trim();
    if(!text){ toast('Выберите файл или вставьте текст копии.'); return; }
    let data;
    try{ data = JSON.parse(text); }
    catch(e){ toast('Не удалось прочитать текст — это должен быть JSON-файл резервной копии.'); return; }
    if(!Array.isArray(data.clients) || !Array.isArray(data.revenue)){
      toast('Файл не похож на резервную копию этого приложения.');
      return;
    }
    askConfirm('Заменить данные?', 'Все текущие данные будут заменены данными из этой копии. Отменить это будет нельзя.', 'Да, заменить', ()=>{
      window.__force = true;
      clients = data.clients;
      revenue = data.revenue;
      saveClients();
      saveRevenue();
      if(Array.isArray(data.tasks)){
        tasks = data.tasks;
        saveTasks();
      }
      if(Array.isArray(data.offDays)){
        offDays = data.offDays;
        saveOffDays();
      }
      window.__force = false;
      closeSheet();
      render();
      toast('Данные восстановлены из копии.');
    }, true);
  });
}

        </select>
      </label>

      <label class="field"><span>Сумма, ₽</span><input type="number" min="0" name="amount" value="${prefill.amount||''}"></label>
      <label class="field"><span>Вид оплаты</span>
        <div class="seg" id="type-seg">
          <button type="button" class="active" data-val="cash">Наличные</button>
          <button type="button" data-val="transfer">Перевод</button>
        </div>

      <label class="field"><span>Комментарий</span><textarea name="comment"></textarea></label>
      <div class="row-btns">
        <button type="button" class="btn btn-ghost" data-action="close-sheet">Отмена</button>
        <button type="button" id="income-save-btn" class="btn btn-primary">Сохранить</button>
      </div>
    </form>
  `);
  const seg = document.getElementById('type-seg');
  seg.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      seg.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelector('#income-form input[name=paymentType]').value = btn.dataset.val;
    });
  });
  (function(){
    const f = document.getElementById('income-form');
    const fs = f.querySelector('[name=forSessions]'), am = f.querySelector('[name=amount]'), cl = f.querySelector('[name=clientId]');
    let auto = !am.value || Number(am.value)===Number((clients.find(x=>x.id===prefill.clientId)||{}).price);
    am.addEventListener('input', ()=>{ auto = false; });
    const recalc = ()=>{
      const n = Number(fs.value);
      const client = clients.find(x=>x.id===cl.value);
      if(auto && client && n>1) am.value = n*Number(client.price||0);
    };
    fs.addEventListener('input', recalc);
    cl.addEventListener('change', ()=>{ auto = !am.value; recalc(); });
  })();
  document.getElementById('income-save-btn').addEventListener('click', ()=>{
    const fd = new FormData(document.getElementById('income-form'));
    const errBox = document.getElementById('income-form-error');
    if(!fd.get('date') || !fd.get('amount') || Number(fd.get('amount'))<=0){
      errBox.textContent = 'Укажите дату и сумму больше нуля';
      errBox.classList.remove('hidden');
      return;
    }
    errBox.classList.add('hidden');
    const clientId = fd.get('clientId') || null;
    let courseId = prefill.courseId || null;
    if(clientId && !courseId){
      const client = clients.find(c=>c.id===clientId);
      const lc = client ? latestCourse(client) : null;
      courseId = lc ? lc.id : null;
    }
    const nForward = Number(fd.get('forSessions'));
    const entry = {
      id: genId(),
      date: fd.get('date'),
      clientId: clientId,
      courseId: courseId,
      amount: Number(fd.get('amount')),
      paymentType: fd.get('paymentType'),
      comment: fd.get('comment'),
      createdAt: Date.now()
    };
    if(clientId && courseId && nForward>1) entry.forSessions = Math.floor(nForward);
    revenue.push(entry);
    saveRevenue();
    closeSheet();
    render();
  });
}

/* ---------------- Sheet system ---------------- */
function showSheet(html){
  document.getElementById('sheet').innerHTML = html;
  const overlay = document.getElementById('overlay');
  overlay.classList.remove('hidden');
  requestAnimationFrame(()=>overlay.classList.add('show'));
}
function closeSheet(){
  const overlay = document.getElementById('overlay');
  overlay.classList.remove('show');
  setTimeout(()=>overlay.classList.add('hidden'), 180);
}

/* ---------------- Event delegation ---------------- */
document.getElementById('overlay').addEventListener('click', (e)=>{
  if(e.target.id==='overlay') closeSheet();
});

document.addEventListener('click', (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;

  if(action==='tab'){ activeTab = el.dataset.tab; render(); }
  else if(action==='show-month-view'){ calendarView='month'; render(); }
  else if(action==='show-today-view'){ calendarView='today'; render(); }
  else if(action==='prev-month'){ calMonth--; if(calMonth<0){calMonth=11;calYear--;} render(); }
  else if(action==='next-month'){ calMonth++; if(calMonth>11){calMonth=0;calYear++;} render(); }
  else if(action==='tasks-view'){ tasksView = el.dataset.view; render(); }
  else if(action==='open-task-day'){ openTaskDaySheet(el.dataset.date); }
  else if(action==='prev-year'){ calYear--; render(); }
  else if(action==='next-year'){ calYear++; render(); }
  else if(action==='analytics-view'){ analyticsView = el.dataset.view; render(); }
  else if(action==='open-day'){ openDaySheet(el.dataset.date); }
  else if(action==='add-client'){ openClientForm(null); }
  else if(action==='open-client'){ openClientDetail(el.dataset.id); }
  else if(action==='edit-client'){ closeSheet(); setTimeout(()=>openClientForm(clients.find(c=>c.id===el.dataset.id)),190); }
  else if(action==='add-sibling'){
    const base = clients.find(c=>c.id===el.dataset.id);
    if(base){
      const prefill = {parentName:base.parentName, phone:base.phone, phones:base.phones, street:base.street, apartment:base.apartment, entrance:base.entrance, floor:base.floor, addresses:base.addresses, familyId: base.familyId||base.id};
      closeSheet();
      setTimeout(()=>openClientForm(null, prefill), 190);
    }
  }
  else if(action==='delete-client'){ const did = el.dataset.id; askConfirm('Удалить клиента?', 'Клиент и вся история курсов будут удалены. Записи о доходах останутся. Клиента можно будет восстановить из «Удалённых».', 'Да, удалить', ()=>deleteClient(did), true); }
  else if(action==='open-deleted'){ openDeletedSheet(); }
  else if(action==='restore-client'){ restoreClient(el.dataset.id); }
  else if(action==='permadelete-client'){ permanentlyDeleteClient(el.dataset.id); }
  else if(action==='start-new-course'){ startNewCourse(el.dataset.id); }
  else if(action==='open-add-off'){ openAddOffPicker(el.dataset.course); }
  else if(action==='unmark-off'){ removeOffDate(el.dataset.course, el.dataset.date); }
  else if(action==='interrupt-course'){ interruptCourse(el.dataset.client, el.dataset.course, el.dataset.date); }
  else if(action==='resume-course'){ resumeCourse(el.dataset.course); }
  else if(action==='off-mode-on'){ offSelectMode = true; offMsg=''; render(); }
  else if(action==='off-mode-off'){ offSelectMode = false; offMsg=''; render(); }
  else if(action==='toggle-offday'){ toggleOffDay(el.dataset.date); }
  else if(action==='move-auto'){
    const cl = clients.find(x=>x.id===el.dataset.client);
    const cid = el.dataset.client, coid = el.dataset.course, dt = el.dataset.date;
    askConfirm('Перенести сеанс?', (cl ? cl.parentName+' · '+cl.childName+'\n' : '')+'Сеанс '+fmtDateLong(dt)+' уйдёт на ближайший свободный день в конце курса. Курс закончится позже.', 'Да, перенести', ()=>autoMoveSession(cid, coid, dt), false);
  }
  else if(action==='confirm-yes'){ const fn = pendingConfirm; pendingConfirm = null; if(fn) fn(); }
  else if(action==='open-search'){ openSearchSheet(); }
  else if(action==='move-session'){ openMoveSession(el.dataset.client, el.dataset.course, el.dataset.date); }
  else if(action==='mark-off'){ markOffFromCalendar(el.dataset.client, el.dataset.course, el.dataset.date); }
  else if(action==='log-payment'){
    closeSheet();
    const client = clients.find(c=>c.id===el.dataset.client);
    setTimeout(()=>openIncomeForm({date:el.dataset.date, clientId:el.dataset.client, courseId:el.dataset.course, amount: client?client.price:''}),190);
  }
  else if(action==='edit-payment'){ openEditPayment(el.dataset.rev); }
  else if(action==='delete-payment'){ const rid = el.dataset.rev; askConfirm('Удалить запись о доходе?', 'Запись исчезнет из доходов и аналитики.', 'Да, удалить', ()=>deletePayment(rid), true); }
  else if(action==='add-income'){ openIncomeForm({date: el.dataset.date}); }
  else if(action==='day-off-all'){ markDayOffForAll(el.dataset.date); }
  else if(action==='day-off-restore'){ restoreDayForAll(el.dataset.date); }
  else if(action==='phone'){
    openPhoneSheet(el.dataset.phone, el.dataset.label, el.dataset.name);
  }
  else if(action==='toggle-details'){
    const row = el.closest('.session-row');
    if(row) row.classList.toggle('open');
  }
  else if(action==='open-district'){
    activeTab = 'clients';
    clientDistrictFilter = el.dataset.district;
    clientStatusFilter = 'all';
    clientSearch = '';
    render();
  }
  else if(action==='add-task'){ openTaskForm(null, el.dataset.date, !!el.dataset.nodeadline); }
  else if(action==='edit-task'){ openTaskForm(el.dataset.id); }
  else if(action==='toggle-task'){ toggleTask(el.dataset.id); }
  else if(action==='open-map'){ openMapFor(el.dataset.client, Number(el.dataset.address||0)); }
  else if(action==='edit-time'){ openEditSessionTime(el.dataset.client, el.dataset.course, el.dataset.date); }
  else if(action==='edit-address'){ openEditSessionAddress(el.dataset.client, el.dataset.course, el.dataset.date); }
  else if(action==='pick-address'){ pickSessionAddress(el.dataset.client, el.dataset.course, el.dataset.date, Number(el.dataset.idx)); }
  else if(action==='reset-time'){ resetSessionTime(el.dataset.client, el.dataset.course, el.dataset.date); }
  else if(action==='dismiss-followup'){ dismissFollowUp(el.dataset.client); }
  else if(action==='filter-status'){ clientStatusFilter = el.dataset.status; render(); }
  else if(action==='set-course-status'){ setCourseStatus(el.dataset.course, el.dataset.status); }
  else if(action==='edit-course'){ openEditCourseForm(el.dataset.course); }
  else if(action==='open-export'){ openExportSheet(); }
  else if(action==='open-import'){ openImportSheet(); }
  else if(action==='download-export'){ downloadExport(); }
  else if(action==='copy-export'){ copyExport(); }
  else if(action==='close-sheet'){ closeSheet(); }
});

document.addEventListener('input', (e)=>{
  if(e.target.dataset.action==='global-search'){
    const box = document.getElementById('search-results');
    if(box) box.innerHTML = searchResultsHtml(e.target.value);
    return;
  }
  if(e.target.dataset.action==='search-clients'){
    clientSearch = e.target.value;
    const main = document.getElementById('main');
    main.innerHTML = renderClients();
    const inp = main.querySelector('[data-action="search-clients"]');
    if(inp){
      inp.focus();
      try{ inp.setSelectionRange(inp.value.length, inp.value.length); }catch(_){}
    }
  }
});

document.addEventListener('change', (e)=>{
  if(e.target.dataset && e.target.dataset.action==='filter-district'){
    clientDistrictFilter = e.target.value;
    render();
  }
});

/* ---------------- Init ---------------- */
window.__reload = async function(){
  if(window.__reloading) return;
  window.__reloading = true;
  try{
    window.__loadFailed = false;
    await loadState();
    if(isSheetOpen()) closeSheet();
    render();
    if(window.__loadFailed) toast('Нет связи с сервером — данные не обновлены.');
  }finally{ window.__reloading = false; }
};
async function syncFromServer(){
  if(document.hidden || window.__reloading) return;
  if(isSheetOpen()) return;
  const a = document.activeElement;
  if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
  try{
    const r = await fetch('/api/versions', {credentials:'same-origin', cache:'no-store'});
    if(r.status===401){ location.href='/login'; return; }
    if(!r.ok) return;
    const j = await r.json();
    const keys = ['mj-clients','mj-revenue','mj-tasks','mj-offdays'];
    if(keys.some(k=>(j.versions[k]||0)!==(window.__versions[k]||0))) await window.__reload();
  }catch(e){}
}
(async function init(){
  await (window.__ready || Promise.resolve());
  await loadState();
  render();
  if(window.__loadFailed) toast('Нет связи с сервером — данные не загружены. Проверьте интернет.');
  setInterval(syncFromServer, 15000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) syncFromServer(); });
})();
</script>
